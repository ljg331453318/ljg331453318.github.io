<div id="world" aria-label="可交互的立体云栖道观"><canvas id="scene" tabindex="0" aria-label="云栖庭院。点击地面行走，拖动视角环顾，或用 WASD 移动；点击地标可前往各处。"></canvas></div>
<div class="vignette" aria-hidden="true"></div>
<header class="hud-top"><a class="brand" href="#" id="home"><span class="brand-seal" lang="zh">云<br>道</span><span>云道 · 云栖观<small>云栖山 · 线上道观</small></span></a><div class="world-time"><span class="time-orbit"></span><span id="time-label">清晨时分<small>晨雾轻笼 · 清晨</small></span></div><div class="utilities"><button class="utility" id="sound-toggle" aria-label="开启山间声景" title="山间声景"><svg><use href="#i-mute"/></svg></button><button class="utility" id="day-toggle" aria-label="切换至月夜" title="昼夜流转"><svg><use href="#i-sun"/></svg></button><button class="utility" id="help" aria-label="游历指南" title="游历指南"><svg><use href="#i-help"/></svg></button></div></header>
<section class="welcome" id="welcome"><div class="overline"><span></span> 山中有奇遇，静候有缘人</div><h1>一签问心。<br>一径寻幽。<br><em>一方自在天地。</em></h1><p>解开月门，试炼灵物。<br>在云深处，安放自己的小天地。</p><button class="enter-button" id="enter">进入云栖山 <span class="enter-symbol">入</span></button><div class="welcome-foot">山间寻幽 · 炉前试炼 · 洞天小住</div></section>
<button id="submission-entry" class="submission-entry" aria-label="SCI论文投稿黄道吉日"><span>SCI 论文投稿</span><strong>投稿黄道吉日</strong><small>八字排盘 · 问时起卦 · 融合择日</small></button>
<button class="study-entry" data-action="study"><span aria-hidden="true">易</span><span>易学研习<small>八字 · 梅花课堂</small></span></button>
<button class="adventure-card" id="adventure-card" inert aria-label="查看山行任务"></button>
<button class="satchel-button" id="satchel-button" aria-label="打开行囊"><svg><use href="#i-bag"/></svg><span>行囊</span><strong id="satchel-count">0</strong></button>
<div class="scene-labels" id="scene-labels" inert aria-label="山中各处"></div>
<div class="location-card" id="location-card"><span class="overline">此刻所在</span><h2 id="location-name">云栖庭院</h2><p id="location-description">山中无所求，且自在停留。</p><span class="coordinates">云栖山 · 一方自在天地</span></div>
<div class="movement-hint" id="movement-hint"><span><kbd>W</kbd><span class="key-row"><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span></span><p>点击行走 · 拖动环顾<br><span>滚动缩放视角</span></p></div>
<nav class="action-dock" aria-label="山中活动"><button data-action="fortune"><svg><use href="#i-fortune"/></svg><span>抽一支签</span></button><button data-action="alchemy"><svg><use href="#i-flame"/></svg><span>炼丹试炉</span></button><button data-action="adventure" class="active"><svg><use href="#i-map"/></svg><span>山间寻幽</span></button><button data-action="retreat"><svg><use href="#i-home"/></svg><span>我的洞天</span></button><span class="dock-divider"></span><button data-action="meditate"><svg><use href="#i-meditate"/></svg><span>静坐片刻</span></button></nav>
<button class="journey-badge" id="journey" aria-label="查看修习之路"><span class="journey-icon">☯</span><span>初心境<small id="journey-points">静心值 0</small></span></button>
<div class="audio-caption" id="audio-caption"><span class="sound-bars"><i></i><i></i><i></i></span><span id="audio-label">山静候，风亦听</span><button id="music-open">选择声景</button></div>
<div class="practice-overlay" id="practice-overlay" hidden><div class="practice-orbit"></div><span class="overline">此刻，且安心安坐</span><h2 id="practice-time">5:00</h2><p id="practice-phrase">让呼吸，自有节律。</p><div><button id="practice-pause">暂停</button><button id="practice-end">结束静坐</button></div></div>

<div class="toast" id="toast" role="status"></div>
<div class="mobile-movement"><button id="move-up" aria-label="向前行走">W</button><div><button id="move-left" aria-label="向左行走">A</button><button id="move-down" aria-label="向后行走">S</button><button id="move-right" aria-label="向右行走">D</button></div></div>
